name: CI

on:
  push:
    branches: [main, 'maui/**']
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Tests compare formatted numbers; pin a '.'-decimal culture until the culture-sensitive parsing is fixed.
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  core:
    name: Core libraries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # SDK from Src/global.json (builds net10.0 + net11.0) plus the .NET 10 runtime to run the net10.0 tests.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Src/global.json
          dotnet-version: 10.0.x

      - name: Build Melville.StreamInterfaces into the local feed
        shell: bash
        run: ./build-local-packages.sh

      - name: Build
        working-directory: Src
        run: dotnet build Src.CrossPlatform.slnf -c Release -p:GeneratePackageOnBuild=false

      - name: Test net10.0
        working-directory: Src
        # 43 known failures on LF checkouts (tests hard-code CRLF); non-blocking on macOS until fixed.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: dotnet test --project Melville.Pdf.DataModelTests/Melville.Pdf.DataModelTests.csproj -c Release --no-build -f net10.0

      - name: Test net11.0
        working-directory: Src
        # 43 known failures on LF checkouts (tests hard-code CRLF); non-blocking on macOS until fixed.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: dotnet test --project Melville.Pdf.DataModelTests/Melville.Pdf.DataModelTests.csproj -c Release --no-build -f net11.0

      # New projects are not in upstream's Src.sln (kept unmodified), so they build on their own.
      - name: Viewer model tests (net10.0 and net11.0)
        working-directory: Src
        run: |
          dotnet build Melville.Pdf.ViewerModel.Tests/Melville.Pdf.ViewerModel.Tests.csproj -c Release
          dotnet test --project Melville.Pdf.ViewerModel.Tests/Melville.Pdf.ViewerModel.Tests.csproj -c Release --no-build -f net10.0
          dotnet test --project Melville.Pdf.ViewerModel.Tests/Melville.Pdf.ViewerModel.Tests.csproj -c Release --no-build -f net11.0

      # Every reference document rendered by the Maui.Graphics renderer (on Skia) against the SkiaSharp renderer.
      - name: Maui.Graphics renderer tests (net10.0 and net11.0)
        working-directory: Src
        run: |
          dotnet build Melville.Pdf.MauiGraphics.Tests/Melville.Pdf.MauiGraphics.Tests.csproj -c Release
          dotnet test --project Melville.Pdf.MauiGraphics.Tests/Melville.Pdf.MauiGraphics.Tests.csproj -c Release --no-build -f net10.0
          dotnet test --project Melville.Pdf.MauiGraphics.Tests/Melville.Pdf.MauiGraphics.Tests.csproj -c Release --no-build -f net11.0

  # Plugin.Maui.Pdf, its sample and the test app on every platform. Build only: devices are checked by hand
  # (DevFlow, or the test app's MELVILLE_AUTORUN; see spikes/README.md).
  sample:
    name: Plugin.Maui.Pdf apps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            workloads: maui-android maui-ios maui-maccatalyst
            frameworks: net10.0-android net10.0-ios net10.0-maccatalyst
          - os: windows-latest
            workloads: maui-windows maui-android
            frameworks: net10.0-windows10.0.19041.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Src/global.json
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install ${{ matrix.workloads }}

      - name: Build Melville.StreamInterfaces into the local feed
        shell: bash
        run: ./build-local-packages.sh

      - name: Build the sample and the test app
        working-directory: Src
        shell: bash
        # iOS builds for the simulator, which needs no signing.
        run: |
          for app in Plugin.Maui.Pdf.Sample Plugin.Maui.Pdf.TestApp; do
            for tfm in ${{ matrix.frameworks }}; do
              extra=""
              if [[ $tfm == *-ios ]]; then extra="-p:RuntimeIdentifier=iossimulator-arm64"; fi
              dotnet build $app/$app.csproj -c Release -f $tfm $extra
            done
          done

      # Phase 8 gate: Native AOT with full trimming must publish without trim/AOT (IL) warnings.
      - name: Native AOT publish (Mac Catalyst), no IL warnings
        if: runner.os == 'macOS'
        working-directory: Src
        shell: bash
        run: |
          dotnet publish Plugin.Maui.Pdf.TestApp/Plugin.Maui.Pdf.TestApp.csproj -f net10.0-maccatalyst -c Release \
            -p:RuntimeIdentifier=maccatalyst-arm64 -p:MelvilleNativeAot=true -p:CreatePackage=false | tee aot.log
          if grep -E "warning IL[0-9]+" aot.log; then echo "::error::trim/AOT warnings"; exit 1; fi

  # The NuGet packages, as a build artifact (never pushed; see release-nuget.yml). Packed on Windows: only Windows
  # can build the windows target, and it builds the Android, iOS and Mac Catalyst library targets too.
  pack:
    name: Pack Plugin.Maui.Pdf
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Src/global.json
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Pack
        shell: bash
        run: ./pack-nuget.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/
